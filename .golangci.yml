version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    revive:
      rules:
        - name: exported
          disabled: true # doc comments on every exported name is noise for a small app
  exclusions:
    generated: lax # sqlc output is marked "Code generated ... DO NOT EDIT"
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [bodyclose, noctx, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - ghostman
